<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontaj Echipa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">🟢 Cine e la muncă?</h1>
            <div id="userBadge" class="text-xs bg-gray-100 px-2 py-1 rounded"></div>
        </div>

        <!-- Buton Principal -->
        <div id="actionArea" class="mb-8">
            <button id="mainBtn" class="w-full py-4 rounded-lg font-bold text-white shadow-lg transition-transform active:scale-95"></button>
        </div>

        <!-- Lista Echipa -->
        <div class="border-t pt-4">
            <h2 class="text-sm font-bold text-gray-400 uppercase mb-4">Echipa Online:</h2>
            <div id="staffList" class="space-y-3">
                <p class="text-gray-400 text-sm italic">Se încarcă lista...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkTlrR4Sli5jqtP7D80RGxdGFevhkRpOE",
            authDomain: "pontaj-staff.firebaseapp.com",
            projectId: "pontaj-staff",
            storageBucket: "pontaj-staff.firebasestorage.app",
            messagingSenderId: "684456604284",
            appId: "1:684456604284:web:b6a000722562624d49cff9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Verificare Nume
        let myName = localStorage.getItem('p_name');
        if (!myName) {
            myName = prompt("Introdu numele tău:");
            if (myName) localStorage.setItem('p_name', myName);
        }
        document.getElementById('userBadge').innerText = myName;

        const myId = myName ? myName.replace(/\s+/g, '_').toLowerCase() : null;

        // Ascultare date LIVE
        onValue(ref(db, 'prezenta'), (snap) => {
            const data = snap.val() || {};
            const listDiv = document.getElementById('staffList');
            const btn = document.getElementById('mainBtn');
            listDiv.innerHTML = "";

            let suntPontat = false;

            Object.entries(data).forEach(([id, info]) => {
                if (id === myId) suntPontat = true;

                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3 bg-gray-50 rounded-lg border";
                item.innerHTML = `
                    <span class="font-bold">${info.name}</span>
                    <div class="flex items-center gap-4">
                        <span class="text-xs text-gray-400">${new Date(info.since).toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'})}</span>
                        ${myName === "Metin Patrascu" ? `<button onclick="window.sterge('${id}')" class="text-red-400 font-bold px-2">X</button>` : ''}
                    </div>
                `;
                listDiv.appendChild(item);
            });

            if (Object.keys(data).length === 0) {
                listDiv.innerHTML = '<p class="text-gray-400 text-sm">Nimeni nu este la muncă momentan.</p>';
            }

            // Update Buton
            if (suntPontat) {
                btn.innerText = "IEȘIRE PROGRAM";
                btn.className = "w-full py-4 rounded-lg font-bold text-white shadow-lg bg-red-500";
                btn.onclick = () => remove(ref(db, `prezenta/${myId}`));
            } else {
                btn.innerText = "INTRARE PROGRAM";
                btn.className = "w-full py-4 rounded-lg font-bold text-white shadow-lg bg-blue-600";
                btn.onclick = () => set(ref(db, `prezenta/${myId}`), { name: myName, since: serverTimestamp() });
            }
        });

        window.sterge = (id) => { if(confirm("Elimini persoana?")) remove(ref(db, `prezenta/${id}`)); };
    </script>
</body>
</html>
