<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pontaj Echipa - LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .pulse-ring { animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">

    <!-- Incarcare -->
    <div id="loadingScreen" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
            <p class="text-slate-500 text-sm">Se conectează la baza de date...</p>
        </div>
    </div>

    <div id="mainContent" class="max-w-4xl mx-auto px-4 pt-6 hidden">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                <i data-lucide="clock" class="text-blue-600"></i> Pontaj Live
            </h1>
            <div class="flex items-center gap-3 bg-white p-2 rounded-lg shadow-sm">
                <span id="userName" class="font-bold text-sm"></span>
                <button id="logoutBtn" class="text-rose-500"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
        </header>

        <!-- Sectiune Butoane -->
        <div class="bg-white rounded-2xl shadow-sm border p-6 mb-6 text-center">
            <div id="statusBadge" class="mb-4 inline-block px-3 py-1 rounded-full text-xs font-bold bg-slate-100 uppercase tracking-wider">Deconectat</div>
            <div class="flex gap-4">
                <button id="checkInBtn" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition-all">INTRARE</button>
                <button id="checkOutBtn" class="flex-1 bg-rose-500 text-white py-4 rounded-xl font-bold hover:bg-rose-600 transition-all hidden">IEȘIRE</button>
            </div>
        </div>

        <!-- Tabel Live -->
        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div class="p-4 border-b bg-slate-50 font-bold text-sm">ACTIVITATE ECHIPA - AZI</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-xs text-slate-400 uppercase bg-slate-50">
                        <tr>
                            <th class="p-4">Nume</th>
                            <th class="p-4">Intrare</th>
                            <th class="p-4">Ieșire</th>
                            <th class="p-4 text-right">Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody id="liveTable" class="divide-y text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Login -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-40 hidden">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Cine ești?</h2>
            <input type="text" id="nameInput" placeholder="Numele tău complet" class="w-full p-4 border rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <button id="loginBtn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">LOGARE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkTlrR4Sli5jqtP7D80RGxdGFevhkRpOE",
            authDomain: "pontaj-staff.firebaseapp.com",
            projectId: "pontaj-staff",
            storageBucket: "pontaj-staff.firebasestorage.app",
            messagingSenderId: "684456604284",
            appId: "1:684456604284:web:b6a000722562624d49cff9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const ADMIN_NAME = "Metin Patrascu";

        const dom = {
            loading: document.getElementById('loadingScreen'),
            main: document.getElementById('mainContent'),
            auth: document.getElementById('authModal'),
            table: document.getElementById('liveTable'),
            status: document.getElementById('statusBadge')
        };

        onAuthStateChanged(auth, (user) => {
            const name = localStorage.getItem('user_name');
            if (user && name) {
                startApp(name);
            } else {
                dom.loading.classList.add('hidden');
                dom.auth.classList.remove('hidden');
            }
        });

        document.getElementById('loginBtn').onclick = async () => {
            const name = document.getElementById('nameInput').value.trim();
            if (name.length < 3) return alert("Numele este prea scurt!");
            localStorage.setItem('user_name', name);
            await signInAnonymously(auth);
            startApp(name);
        };

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.clear();
            signOut(auth).then(() => location.reload());
        };

        function startApp(name) {
            dom.auth.classList.add('hidden');
            dom.loading.classList.add('hidden');
            dom.main.classList.remove('hidden');
            document.getElementById('userName').innerText = name;
            lucide.createIcons();
            listenLive();
        }

        const getTodayPath = () => `pontaje/${new Date().toISOString().split('T')[0]}`;

        function listenLive() {
            const myName = localStorage.getItem('user_name');
            const myId = myName.replace(/\s+/g, '_').toLowerCase();

            onValue(ref(db, getTodayPath()), (snap) => {
                const data = snap.val() || {};
                dom.table.innerHTML = "";
                
                Object.entries(data).forEach(([id, p]) => {
                    // Update butoane pentru mine
                    if (id === myId) {
                        if (p.checkIn && !p.checkOut) {
                            dom.status.innerText = "Sunteți la muncă";
                            dom.status.className = "mb-4 inline-block px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 pulse-ring uppercase tracking-wider";
                            document.getElementById('checkInBtn').classList.add('hidden');
                            document.getElementById('checkOutBtn').classList.remove('hidden');
                        } else {
                            dom.status.innerText = "Program încheiat";
                            dom.status.className = "mb-4 inline-block px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-400 uppercase tracking-wider";
                            document.getElementById('checkInBtn').classList.add('hidden');
                            document.getElementById('checkOutBtn').classList.add('hidden');
                        }
                    }

                    // Generare rand tabel
                    const isAdmin = myName === ADMIN_NAME;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-4 font-bold">${p.name}</td>
                        <td class="p-4 text-green-600 font-mono">${fmt(p.checkIn)}</td>
                        <td class="p-4 text-rose-500 font-mono">${fmt(p.checkOut)}</td>
                        <td class="p-4 text-right">
                            ${isAdmin ? `<button onclick="window.deleteEntry('${id}')" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                        </td>
                    `;
                    dom.table.appendChild(row);
                });
                lucide.createIcons();
            });
        }

        document.getElementById('checkInBtn').onclick = () => {
            const name = localStorage.getItem('user_name');
            const id = name.replace(/\s+/g, '_').toLowerCase();
            set(ref(db, `${getTodayPath()}/${id}`), {
                name, checkIn: serverTimestamp(), checkOut: null
            });
        };

        document.getElementById('checkOutBtn').onclick = () => {
            const name = localStorage.getItem('user_name');
            const id = name.replace(/\s+/g, '_').toLowerCase();
            set(ref(db, `${getTodayPath()}/${id}/checkOut`), serverTimestamp());
        };

        window.deleteEntry = (id) => {
            if(confirm("Ștergi acest pontaj?")) {
                remove(ref(db, `${getTodayPath()}/${id}`));
            }
        };

        const fmt = (ts) => ts ? new Date(ts).toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'}) : '--:--';
        init();
    </script>
</body>
</html>
