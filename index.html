<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>Pontaj Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-gray-800 font-sans antialiased">
  
  <div id="app"></div>

  <script type="module">
    // Importăm și modulul de Autentificare
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

    // Setare Hibridă: Permite funcționarea atât aici în previzualizare cât și pe GitHub
    const isCanvas = typeof __firebase_config !== 'undefined';
    const firebaseConfig = isCanvas 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyAkTIrR4S1i5jqtP7D80RGxdGFevhkRpOE",
          authDomain: "pontaj-staff.firebaseapp.com",
          projectId: "pontaj-staff",
          storageBucket: "pontaj-staff.firebasestorage.app",
          messagingSenderId: "684456604284",
          appId: "1:684456604284:web:b6a000722562624d49cff9"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // Configurăm calea în funcție de mediul în care rulează
    const canvasAppId = typeof __app_id !== 'undefined' ? __app_id : 'pontaj-app';
    const timesheetsRef = isCanvas
      ? collection(db, 'artifacts', canvasAppId, 'public', 'data', 'pontaje')
      : collection(db, 'pontaje');

    let userName = localStorage.getItem('pontaj_username') || '';
    let records = [];
    let isLoading = true;
    let loadingError = null;
    let aiSummary = null; 
    let isGeneratingAi = false; 
    const apiKey = ""; 
    const appDiv = document.getElementById('app');

    function render() {
      // 1. ECRAN DE LOGARE (Apare INSTANTANEU!)
      if (!userName) {
        appDiv.innerHTML = `
          <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md text-center border-t-4 border-blue-600">
              <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-chart-line text-2xl"></i>
              </div>
              <h1 class="text-2xl font-bold mb-2">Aplicație Pontaj</h1>
              <p class="text-gray-500 mb-8">Introdu numele tău pentru a continua</p>
              <form id="loginForm" class="space-y-4">
                <input type="text" id="nameInput" placeholder="Ex: Ion Popescu" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-lg font-medium text-center" required minlength="2">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-transform active:scale-95 shadow-md">
                  Intră în aplicație
                </button>
              </form>
            </div>
          </div>`;
        
        document.getElementById('loginForm').onsubmit = (e) => {
          e.preventDefault();
          const val = document.getElementById('nameInput').value.trim();
          if (val.length >= 2) {
            userName = val;
            localStorage.setItem('pontaj_username', userName);
            render(); 
          }
        };
        return;
      }

      // 2. Procesarea Datelor pentru Dashboard
      const myActive = records.find(r => r.userName.toLowerCase() === userName.toLowerCase() && r.status === 'active');
      const liveWorkers = records.filter(r => r.status === 'active');
      const historyByDate = records.reduce((acc, r) => {
        if (!acc[r.date]) acc[r.date] = [];
        acc[r.date].push(r);
        return acc;
      }, {});

      // Construire Lista Live
      let liveWorkersHtml = liveWorkers.length === 0 
        ? '<p class="text-gray-500 text-center mt-6">Nimeni nu este pontat acum.</p>' 
        : liveWorkers.map(w => `
          <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
                ${w.userName.substring(0,2).toUpperCase()}
              </div>
              <div>
                <p class="font-semibold text-gray-800">${w.userName}</p>
                <p class="text-xs text-green-600 font-medium">
                  <i class="fas fa-circle text-[8px] animate-pulse mr-1"></i> Online (de la ${formatTime(w.checkIn)})
                </p>
              </div>
            </div>
          </div>
        `).join('');

      // Construire Tabel Istoric
      let historyHtml = Object.keys(historyByDate).length === 0 
        ? '<p class="text-gray-500 text-center mt-6">Nu există date salvate în istoric.</p>' 
        : Object.keys(historyByDate).sort((a,b) => new Date(b) - new Date(a)).map(date => `
          <div class="mb-6">
            <h4 class="text-sm font-bold text-slate-500 mb-3 border-b border-gray-100 pb-2">${formatDateLabel(date)}</h4>
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden overflow-x-auto">
              <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-slate-50 text-slate-600">
                  <tr>
                    <th class="px-4 py-3 font-medium">Nume</th>
                    <th class="px-4 py-3 font-medium">Intrare</th>
                    <th class="px-4 py-3 font-medium">Ieșire</th>
                    <th class="px-4 py-3 font-medium">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                  ${historyByDate[date].map(r => `
                    <tr class="hover:bg-slate-50">
                      <td class="px-4 py-3 font-semibold text-gray-800">${r.userName}</td>
                      <td class="px-4 py-3 text-green-700 font-medium">${formatTime(r.checkIn)}</td>
                      <td class="px-4 py-3 text-red-600 font-medium">${r.checkOut ? formatTime(r.checkOut) : '---'}</td>
                      <td class="px-4 py-3">
                        ${r.status === 'active' 
                          ? '<span class="text-green-700 bg-green-50 px-2.5 py-1 rounded-md text-xs font-semibold border border-green-200">În curs</span>' 
                          : '<span class="text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md text-xs font-semibold border border-slate-200">Finalizat</span>'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `).join('');

      // 3. Renderizare Dashboard (ÎNTOTDEAUNA INSTANT!)
      appDiv.innerHTML = `
        <div class="min-h-screen bg-slate-50 pb-12">
          <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
              <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
                <i class="fas fa-chart-line"></i> Pontaj Live
              </h1>
              <div class="flex items-center gap-4">
                <span class="text-gray-600 font-medium hidden sm:block"><i class="fas fa-user-check mr-2"></i> ${userName}</span>
                <button id="logoutBtn" class="text-sm text-red-500 font-bold hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg border border-red-100 transition-colors">Schimbă User</button>
              </div>
            </div>
            ${loadingError ? `<div class="bg-red-100 text-red-800 text-center py-2 text-sm font-semibold border-b border-red-200"><i class="fas fa-exclamation-triangle"></i> ${loadingError}</div>` : ''}
          </header>

          <main class="max-w-5xl mx-auto px-4 mt-8 space-y-6">
            <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center flex flex-col items-center justify-center min-h-[250px]">
              
              <!-- Dacă se încarcă Firebase, arătăm asta rapid în loc de butoane -->
              ${isLoading ? `
                <div class="flex flex-col items-center justify-center">
                  <i class="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                  <h2 class="text-xl font-bold text-gray-700">Se sincronizează datele...</h2>
                </div>
              ` : 
              
              /* Dacă s-a încărcat, arătăm butoanele! */
              (myActive ? `
                <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4">
                  <i class="fas fa-clock text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Ești la muncă</h2>
                <p class="text-gray-600 mb-8">Ai dat Check-in la ora <b class="text-gray-900">${formatTime(myActive.checkIn)}</b></p>
                <button id="checkoutBtn" class="w-full max-w-sm bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-6 rounded-xl text-lg shadow-lg shadow-red-200 transition-transform active:scale-95 flex items-center justify-center gap-2">
                  <i class="fas fa-sign-out-alt"></i> Oferă Check-Out (Ieșire)
                </button>
              ` : `
                <div class="w-20 h-20 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mb-4">
                  <i class="fas fa-sign-in-alt text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Nu ești pontat activ</h2>
                <p class="text-gray-600 mb-8">Apasă butonul de mai jos când începi munca.</p>
                <button id="checkinBtn" class="w-full max-w-sm bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-xl text-lg shadow-lg shadow-green-200 transition-transform active:scale-95 flex items-center justify-center gap-2">
                  <i class="fas fa-sign-in-alt"></i> Oferă Check-In (Intrare)
                </button>
              `)}
            </section>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <section class="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
                <div class="flex items-center justify-between border-b border-gray-100 pb-3 mb-4">
                  <h3 class="font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-users text-blue-600"></i> Acum la muncă</h3>
                  <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded-full">${isLoading ? '...' : liveWorkers.length}</span>
                </div>
                ${isLoading ? '<p class="text-gray-500 text-center py-4"><i class="fas fa-circle-notch fa-spin mr-2"></i> Se aduc datele...</p>' : liveWorkersHtml}
              </section>

              <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
                <div class="flex items-center justify-between border-b border-gray-100 pb-3 mb-4">
                  <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="far fa-calendar-alt text-slate-600"></i> Istoric complet pontaj
                  </h3>
                  <button id="aiBtn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold py-1.5 px-3 rounded-lg text-sm transition-colors flex items-center gap-2">
                    <i class="fas fa-magic"></i> Analiză AI ✨
                  </button>
                </div>

                ${aiSummary ? `
                  <div class="mb-6 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl border border-indigo-100 relative">
                    <button id="closeAiBtn" class="absolute top-2 right-2 text-indigo-400 hover:text-indigo-600"><i class="fas fa-times"></i></button>
                    <h4 class="font-bold text-indigo-800 flex items-center gap-2 mb-2"><i class="fas fa-robot"></i> Rezumatul Echipei</h4>
                    <p class="text-sm text-indigo-900 leading-relaxed">${aiSummary}</p>
                  </div>
                ` : ''}

                ${isLoading ? '<p class="text-gray-500 text-center py-4"><i class="fas fa-circle-notch fa-spin mr-2"></i> Se aduc datele...</p>' : historyHtml}
              </section>
            </div>
          </main>
        </div>
      `;

      // Evenimente Butoane
      if (document.getElementById('logoutBtn')) {
        document.getElementById('logoutBtn').onclick = () => {
          localStorage.removeItem('pontaj_username');
          userName = '';
          render();
        };
      }

      if (document.getElementById('checkinBtn')) {
        document.getElementById('checkinBtn').onclick = async () => {
          try {
            document.getElementById('checkinBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Se salvează...';
            document.getElementById('checkinBtn').disabled = true;
            await addDoc(timesheetsRef, {
              userName: userName,
              checkIn: new Date().toISOString(),
              checkOut: null,
              date: getLocalDateString(),
              status: 'active'
            });
          } catch (e) { 
            alert("Eroare de la Firebase: " + e.message); 
            render(); 
          }
        };
      }

      if (document.getElementById('checkoutBtn')) {
        document.getElementById('checkoutBtn').onclick = async () => {
          try {
            document.getElementById('checkoutBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Se salvează...';
            document.getElementById('checkoutBtn').disabled = true;
            
            // Folosim calea dinamică pentru a obține id-ul corect
            const docRef = isCanvas
              ? doc(db, 'artifacts', canvasAppId, 'public', 'data', 'pontaje', myActive.id)
              : doc(db, 'pontaje', myActive.id);
              
            await updateDoc(docRef, {
              checkOut: new Date().toISOString(),
              status: 'completed'
            });
          } catch (e) { 
            alert("Eroare de la Firebase: " + e.message); 
            render(); 
          }
        };
      }

      if (document.getElementById('closeAiBtn')) {
        document.getElementById('closeAiBtn').onclick = () => {
          aiSummary = null;
          render();
        };
      }

      if (document.getElementById('aiBtn')) {
        document.getElementById('aiBtn').onclick = async () => {
          if (isGeneratingAi) return;
          
          isGeneratingAi = true;
          document.getElementById('aiBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analizez...';
          document.getElementById('aiBtn').disabled = true;
          
          try {
            const todayStr = getLocalDateString();
            const todayRecords = records.filter(r => r.date === todayStr);
            
            if(todayRecords.length === 0) {
                aiSummary = "Nu există date de pontaj pe care să le analizez.";
            } else {
                const dataText = todayRecords.map(r => `${r.userName}: intrat la ${formatTime(r.checkIn)}, ieșit la ${r.checkOut ? formatTime(r.checkOut) : 'în curs'}`).join('; ');
                const prompt = `Ești un asistent de HR prietenos. Analizează datele: ${dataText}. Scrie un scurt rezumat de 3 propoziții în română. Nu folosi markdown (* sau #).`;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                let resultText = "Eroare la generare.";
                for (let i = 0; i < 5; i++) {
                  try {
                    const response = await fetch(url, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    if (!response.ok) throw new Error('Eroare API');
                    const result = await response.json();
                    resultText = result.candidates?.[0]?.content?.parts?.[0]?.text || "Nu s-a putut genera.";
                    break;
                  } catch (error) {
                    if (i === 4) throw error;
                    await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000));
                  }
                }
                aiSummary = resultText;
            }
          } catch (e) {
            aiSummary = "Eroare la AI.";
          }
          
          isGeneratingAi = false;
          render();
        };
      }
    }

    // Funcții de formatare a datei
    function formatTime(isoStr) { return new Date(isoStr).toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'}); }
    function formatDateLabel(isoStr) { return new Date(isoStr).toLocaleDateString('ro-RO', {weekday:'long', year:'numeric', month:'long', day:'numeric'}); }
    function getLocalDateString() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

    // Rulăm funcția care construiește aplicația INSTANT
    render();

    // ---------------------------------------------------------
    // NOUA LOGICĂ DE CONECTARE (Autentificare Invizibilă Hibridă)
    // ---------------------------------------------------------
    async function initDatabase() {
      try {
        // 1. Verificăm în ce mediu suntem și ne conectăm cu permisiunile corecte
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          // Previzualizare (Canvas)
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          // GitHub Pages
          await signInAnonymously(auth);
        }

        // 2. Acum încercăm să aducem datele cu permisiuni depline
        const snapshot = await getDocs(timesheetsRef);
        records = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
        records.sort((a,b) => new Date(b.checkIn) - new Date(a.checkIn));
        isLoading = false;
        loadingError = null;
        render();

        // 3. Ne abonăm la actualizări live
        onSnapshot(timesheetsRef, (snap) => {
          records = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
          records.sort((a,b) => new Date(b.checkIn) - new Date(a.checkIn));
          render();
        });

      } catch (error) {
        console.error("Firebase Error:", error);
        loadingError = "Baza de date a refuzat conexiunea: " + error.message;
        isLoading = false;
        render();
      }
    }

    initDatabase();

  </script>
</body>
</html>
