<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontaj Echipa - LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="mainContent" class="max-w-2xl mx-auto px-4 pt-10">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold flex items-center gap-2">🟢 Cine e la muncă?</h1>
            <div class="flex items-center gap-2 bg-white px-3 py-1 rounded-full border text-sm font-bold">
                <span id="userNameDisplay"></span>
                <button id="logoutBtn" class="text-red-500 ml-2">Ieșire Cont</button>
            </div>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border p-8 mb-8 text-center">
            <div id="statusText" class="text-sm font-bold text-slate-400 mb-4 uppercase">Status: Necunoscut</div>
            <button id="actionBtn" class="w-full py-5 rounded-2xl font-bold text-white text-xl transition-all active:scale-95 shadow-lg"></button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div class="p-4 border-b bg-slate-50 font-bold">ECHIPA ONLINE ACUM</div>
            <div id="liveList" class="divide-y"></div>
        </div>
    </div>

    <!-- Login -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4 text-center">Introdu Numele</h2>
            <input type="text" id="nameInput" placeholder="Numele tău" class="w-full p-4 border rounded-xl mb-4 text-center text-lg outline-none">
            <button id="loginBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">LOGARE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkTlrR4Sli5jqtP7D80RGxdGFevhkRpOE",
            authDomain: "pontaj-staff.firebaseapp.com",
            projectId: "pontaj-staff",
            storageBucket: "pontaj-staff.firebasestorage.app",
            messagingSenderId: "684456604284",
            appId: "1:684456604284:web:b6a000722562624d49cff9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const ADMIN = "Metin Patrascu";

        onAuthStateChanged(auth, (user) => {
            const name = localStorage.getItem('p_name');
            if (user && name) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('userNameDisplay').innerText = name;
                startLive(name);
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        });

        document.getElementById('loginBtn').onclick = () => {
            const n = document.getElementById('nameInput').value.trim();
            if(n.length < 2) return;
            localStorage.setItem('p_name', n);
            signInAnonymously(auth);
        };

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.clear();
            signOut(auth).then(() => location.reload());
        };

        function startLive(myName) {
            const myId = myName.replace(/\s+/g, '_').toLowerCase();
            const btn = document.getElementById('actionBtn');
            const status = document.getElementById('statusText');

            onValue(ref(db, 'online'), (snap) => {
                const data = snap.val() || {};
                const list = document.getElementById('liveList');
                list.innerHTML = "";
                
                let imOnline = false;

                Object.entries(data).forEach(([id, p]) => {
                    if (id === myId) imOnline = true;
                    
                    const item = document.createElement('div');
                    item.className = "p-4 flex justify-between items-center bg-white";
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                            <span class="font-bold">${p.name}</span>
                            <span class="text-xs text-slate-400">din: ${new Date(p.since).toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        ${myName === ADMIN ? `<button onclick="window.del('${id}')" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                    `;
                    list.appendChild(item);
                });

                if (imOnline) {
                    status.innerText = "Ești la muncă";
                    status.className = "text-sm font-bold text-green-500 mb-4 uppercase";
                    btn.innerText = "Ieșire Program";
                    btn.className = "w-full py-5 rounded-2xl font-bold text-white text-xl bg-rose-500 shadow-rose-200 shadow-lg";
                    btn.onclick = () => remove(ref(db, `online/${myId}`));
                } else {
                    status.innerText = "Ești Deconectat";
                    status.className = "text-sm font-bold text-slate-400 mb-4 uppercase";
                    btn.innerText = "Intrare Program";
                    btn.className = "w-full py-5 rounded-2xl font-bold text-white text-xl bg-blue-600 shadow-blue-200 shadow-lg";
                    btn.onclick = () => set(ref(db, `online/${myId}`), { name: myName, since: serverTimestamp() });
                }
                lucide.createIcons();
            });
        }

        window.del = (id) => remove(ref(db, `online/${id}`));
    </script>
</body>
</html>
